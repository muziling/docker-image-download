[package]
name = "docker-image-download"
version = "1.0.0"
edition = "2024"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "rustls-tls", "hickory-dns"] }
hickory-resolver = "0.24" # 👈 引入用于自定义 DNS 的解析库
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.0"
tar = "0.4"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
futures-util = "0.3"
indicatif = "0.17"
console = "0.15"
url = "2.5"
